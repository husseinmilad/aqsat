<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت جامع اقساط و بدهی‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf3f0;--cd:#fff;--tx:#12332f;--mu:#5f7a75;--pr:#0f766e;--sf:#e8a317;--bad:#c2410c;--ok:#15803d;--bd:#d5e2dd;--hd:#0d3b36;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a18;--cd:#112826;--tx:#e6f3ef;--mu:#8fb0a9;--bd:#1f3f3b;--pr:#2dd4bf;--ok:#4ade80;--bad:#fb923c;--hd:#06201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1a18;--cd:#112826;--tx:#e6f3ef;--mu:#8fb0a9;--bd:#1f3f3b;--pr:#2dd4bf;--ok:#4ade80;--bad:#fb923c;--hd:#06201d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.8 'Vazirmatn',Vazir,Tahoma,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;font-weight:800}header h1 b{color:var(--sf)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--mu);font:inherit;padding:6px 14px;border-radius:99px;cursor:pointer;transition:.2s}
nav button.on{background:var(--pr);color:#fff;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{border-inline-start:5px solid var(--pr)}.k small{color:var(--mu);display:block}.k b{font-size:17px}
.k.r{border-color:var(--bad)}.k.y{border-color:var(--sf)}.k.o{border-color:var(--ok)}
h3{margin:0 0 10px;font-size:15px}
button.b,.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;padding:4px 12px;border-radius:9px;cursor:pointer}
button.b:hover{border-color:var(--pr)}.pri{background:var(--pr)!important;color:#fff!important;border-color:var(--pr)!important}.dng{color:var(--bad)!important}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu);text-align:center}
.bar i{display:block;width:100%;max-width:46px;background:var(--pr);border-radius:7px 7px 0 0;min-height:3px;animation:up .8s ease-out;transition:.2s}
.bar:hover i{filter:brightness(1.2)}.bar.x i{background:var(--bad)}
@keyframes up{from{height:0!important}}
.dn{width:130px;height:130px;border-radius:50%;margin:auto;display:grid;place-items:center}
.dn span{width:92px;height:92px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-weight:800;font-size:20px}
.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--sf));transition:width .6s}
.bd{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid}
.bd.p{color:var(--ok)}.bd.o{color:var(--bad)}.bd.w{color:var(--sf)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd);flex-wrap:wrap}
.row:last-child{border:0}.row .f{flex:1;min-width:120px}.row small{color:var(--mu)}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:12px;z-index:9}
.md{background:var(--cd);border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto;animation:up2 .25s}
@keyframes up2{from{transform:scale(.94);opacity:0}}
label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}
input,select{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
.dt{display:flex;gap:6px}.tb{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tb input{flex:1;min-width:140px}
.sc{overflow-x:auto}
.sg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--hd);color:#fff;padding:6px 16px;border-radius:99px;z-index:99}
.dn{position:relative}.dn svg{position:absolute;inset:0}.dn span{position:relative}
body{background:radial-gradient(circle at 90% -5%,#2dd4bf55,transparent 42%),radial-gradient(circle at 5% 35%,#e8a31738,transparent 40%),var(--bg);background-attachment:fixed}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;margin:10px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--cd) 50%,transparent);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);border:1px solid #ffffff55;box-shadow:0 8px 30px #0003;scrollbar-width:none}
#nb{position:relative;display:flex;gap:4px}nav button{position:relative;z-index:1}nav button.on{background:none;color:#fff}
#ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:99px;background:linear-gradient(135deg,var(--pr),#14b8a6);box-shadow:0 6px 18px #0f766e77;transition:transform .75s cubic-bezier(.3,1.6,.5,1),width .75s cubic-bezier(.3,1.6,.5,1)}
#ind.sq{animation:sq .75s}@keyframes sq{35%{border-radius:45% 55% 50% 50%/65% 35% 65% 35%;scale:1.14 .82}}
.fl>*{animation:fl .6s cubic-bezier(.2,.8,.2,1) both}.fl>:nth-child(2){animation-delay:.07s}.fl>:nth-child(3){animation-delay:.14s}
@keyframes fl{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(8px)}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;background:linear-gradient(135deg,var(--cd),color-mix(in srgb,var(--pr) 14%,var(--cd)))}
.big{font-size:27px;display:block}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ch{border:1px solid var(--bd);border-radius:99px;padding:0 10px;font-size:12px}
.al{background:#dc2626;color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600;animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 9px #dc262630}}
.bar{cursor:pointer}.bar i{position:relative;overflow:hidden}.bar i u{position:absolute;bottom:0;left:0;right:0;background:var(--ok)}
#tt{position:fixed;z-index:50;background:var(--hd);color:#fff;padding:6px 10px;border-radius:10px;font-size:12px;pointer-events:none;display:none;line-height:1.7}
header h1{font-size:15px}#ind{display:none}nav button{color:var(--tx)}
nav button.on{background:linear-gradient(135deg,#0b5f58,#0f766e);color:#fff;font-weight:600;box-shadow:0 6px 16px #0f766e55;animation:lq .65s cubic-bezier(.3,1.6,.5,1)}
@keyframes lq{0%{transform:scale(.75,1.15);border-radius:40%}45%{transform:scale(1.12,.9);border-radius:55% 45% 60% 40%/50% 60% 40% 50%}100%{transform:none}}
@keyframes fl{from{opacity:0;transform:translateY(14px)}}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{color:var(--mu);font-size:12px}.dy{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:12px;cursor:pointer;border:1px solid var(--bd);transition:.2s}.dy:hover{transform:scale(1.07)}.dy.td{border-color:var(--sf);font-weight:800}.dy.sl{background:var(--pr);color:#fff}
.dt2{position:absolute;bottom:2px;font-size:10px;line-height:1.5;padding:0 6px;border-radius:99px;color:#fff}.dt2.o{background:#dc2626}.dt2.w{background:#b45309}.dt2.p{background:#15803d}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header><h1>مدیریت جامع <b>اقساط و بدهی‌ها</b></h1><button class="b" id="th" onclick="theme()">🌓</button></header>
<nav id="nv"><i id="ind"></i><span id="nb"></span></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),M=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const pd=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),fa=n=>pd(Math.round(n).toLocaleString('en-US')).replace(/,/g,'٬'),money=n=>fa(n)+' تومان';
const num=v=>parseFloat(String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,٬،]/g,''))||0;
const ds=(y,m,d)=>y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0'),lp=y=>[1,5,9,13,17,22,26,30].includes(y%33),dim=(y,m)=>m<7?31:m<12?30:lp(y)?30:29;
const fd=s=>{const[y,m,d]=s.split('/').map(Number);return pd(d)+' '+M[m-1]+' '+pd(y)};
const addM=(s,k)=>{let[y,m,d]=s.split('/').map(Number),t=y*12+m-1+k;y=Math.floor(t/12);m=t%12+1;return ds(y,m,Math.min(d,dim(y,m)))};
const TD=(()=>{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());const g=r=>+p.find(x=>r.test(x.type)).value;return[g(/year/i),g(/month/),g(/day/)]})();
const T=ds(...TD),uid=()=>Math.random().toString(36).slice(2,9);
let db;try{db=JSON.parse(localStorage.getItem('aqsat'))}catch(e){}db=db||{items:[]};db.items.forEach(i=>{if(i.pm==null)i.pm=i.inst[0]?i.inst[0].amt:0});db.cash=db.cash||[];
const save=()=>{try{localStorage.setItem('aqsat',JSON.stringify(db))}catch(e){}try{sched()}catch(e){}};
let tab='d',cur=null,flt='all',q='',mm=T.slice(0,7);
const TABS=[['d','داشبورد'],['loan','تسهیلات'],['buy','خرید اعتباری'],['pers','بدهی شخصی'],['c','تعهدات دوره‌ای'],['m','بدهی‌ها'],['cal','تقویم'],['all','جدول اقساط'],['arc','بایگانی'],['rep','گزارش‌ها'],['set','تنظیمات']];
const all=()=>[...db.items.flatMap(it=>it.inst.map(x=>({x,it}))),...(db.cash||[]).map(x=>({x,it:{title:x.title},cash:1}))],sum=l=>l.reduce((s,a)=>s+a.x.amt,0);
const stt=x=>x.paid?'p':x.due<T?'o':'w',SL={p:'پرداخت‌شده',o:'معوق',w:'در انتظار'};
const bdg=x=>`<span class="bd ${stt(x)}">${SL[stt(x)]}</span>`;
const theme=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';render()};
function gen(it,np){const n=it.n,pm=it.pm,old=it.inst;
 it.inst=Array.from({length:n},(_,i)=>({u:uid(),due:addM(it.start,i),amt:Math.round(pm),paid:np==null?!!(old[i]&&old[i].paid):i<np}))}
function nav(){setTimeout(place,0);$('#nb').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
const go=t=>{tab=t;render();const a=$('#app');a.classList.remove('fl');void a.offsetWidth;a.classList.add('fl')};
function render(){nav();$('#app').innerHTML=tab=='d'?dash2():tab=='all'?allT():tab=='set'?sett():tab=='m'?debts():tab=='c'?cashT():tab=='cal'?calT():tab=='arc'?arcT():tab=='rep'?repT():list(tab);animNums()}
const refresh=()=>{const y=scrollY;render();if(cur)show(cur);scrollTo(0,y)};
function dash(){const A=all(),u=A.filter(a=>!a.x.paid),rem=sum(u),pa=sum(A)-rem,ov=u.filter(a=>a.x.due<T),tot=rem+pa,pc=tot?Math.round(pa/tot*100):0;
 const nx=u.filter(a=>a.x.due>=T).sort((a,b)=>a.x.due<b.x.due?-1:1);const mk=T.slice(0,7),mA=A.filter(a=>a.x.due.startsWith(mk)),mt=sum(mA),mr=sum(mA.filter(a=>!a.x.paid));
 const B=[{l:'معوق',v:sum(ov),x:1}];for(let i=0;i<6;i++){const k=addM(ds(TD[0],TD[1],1),i);B.push({l:M[+k.split('/')[1]-1],v:sum(nx.filter(a=>a.x.due.startsWith(k.slice(0,7))))})}
 const mx=Math.max(...B.map(b=>b.v),1);
 return `<div class="tb"><button class="b pri" onclick="shareImg('#ov','overview')">اشتراک‌گذاری تصویری</button></div><div id="ov"><h3>📒 گزارش اقساط — ${fd(T)}</h3><div class="g"><div class="cd k r"><small>مانده بدهی</small><b>${money(rem)}</b></div><div class="cd k o"><small>پرداخت‌شده</small><b>${money(pa)}</b></div><div class="cd k y"><small>اقساط معوق</small><b>${fa(ov.length)} قسط · ${money(sum(ov))}</b></div><div class="cd k"><small>قسط بعدی</small><b>${nx[0]?fd(nx[0].x.due):'—'}</b></div><div class="cd k y"><small>کل اقساط ${M[TD[1]-1]}</small><b>${money(mt)}</b></div><div class="cd k r"><small>مانده اقساط ${M[TD[1]-1]}</small><b>${money(mr)}</b></div></div>
 <div class="g2"><div class="cd"><h3>بدهی ماهانه (۶ ماه آینده)</h3><div class="bars">${B.map(b=>`<div class="bar ${b.x?'x':''}" title="${money(b.v)}">${b.v?fa(b.v/1e6)+'م':''}<i style="height:${b.v/mx*78}%"></i>${b.l}</div>`).join('')}</div></div>
 <div class="cd"><h3>پیشرفت بازپرداخت</h3><div class="dn"><svg viewBox="0 0 36 36" width="130" height="130"><circle cx="18" cy="18" r="15.9" fill="none" stroke="${gc('--bd')}" stroke-width="4"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="${gc('--pr')}" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="${pc} 100" transform="rotate(-90 18 18)"/></svg><span>${pd(pc)}٪</span></div></div></div>
 <div class="g2"><div class="cd"><h3>اقساط پیش رو و معوق</h3>${[...ov,...nx].slice(0,6).map(a=>`<div class="row"><div class="f"><b>${a.it.title}</b><br><small>${fd(a.x.due)} · ${money(a.x.amt)}</small></div>${bdg(a.x)}<button class="b pri" onclick="tog('${a.x.u}')">پرداخت شد</button></div>`).join('')||'<small>قسط بازی وجود ندارد. از تب تسهیلات یا خرید اعتباری مورد جدید اضافه کنید.</small>'}</div>
 <div class="cd"><h3>وضعیت هر مورد</h3>${db.items.map(it=>{const p=it.inst.filter(x=>x.paid).length;return `<div class="row" style="cursor:pointer" onclick="show('${it.id}')"><div class="f"><b>${it.title}</b><div class="pg"><i style="width:${it.inst.length?p/it.inst.length*100:0}%"></i></div></div><small>${pd(p)}/${pd(it.inst.length)}</small></div>`}).join('')||'<small>هنوز موردی ثبت نشده.</small>'}</div></div></div>`}
function card(it){const p=it.inst.filter(x=>x.paid).length,u=it.inst.filter(x=>!x.paid).sort((a,b)=>a.due<b.due?-1:1);
 return `<div class="cd" id="c_${it.id}"><h3>${it.title} <small style="color:var(--mu);font-weight:400">${it.party||''}</small></h3><small>مبلغ کل: ${money(it.amount)}${it.down?' · پیش‌پرداخت '+money(it.down):''} · قسط ماهانه ${money(it.pm||0)}</small>
 <div class="pg"><i style="width:${it.inst.length?p/it.inst.length*100:0}%"></i></div><small>${pd(p)} از ${pd(it.inst.length)} قسط · مانده ${money(sum(u.map(x=>({x}))))}${u[0]?' · بعدی: '+fd(u[0].due):' · تسویه شد ✓'}</small>
 <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="b pri" onclick="show('${it.id}')">اقساط</button><button class="b" onclick="editItem('${it.id}')">ویرایش</button><button class="b" onclick="dupItem('${it.id}')">کپی</button><button class="b" onclick="shareImg('#c_${it.id}','item')">تصویر</button><button class="b dng" onclick="delItem('${it.id}')">حذف</button></div></div>`}
function list(t){const L=db.items.filter(i=>i.type==t);return `<div class="tb"><button class="b pri" onclick="editItem('',  '${t}')">+ ${t=='loan'?'تسهیلات جدید':'خرید اعتباری جدید'}</button><button class="b" onclick="shareImg('#lst','${t}')">اشتراک‌گذاری تصویری</button></div><div class="g2" id="lst">${L.map(card).join('')||'<div class="cd">موردی ثبت نشده است.</div>'}</div>`}
function allT(){return `<div class="tb"><input id="qq" placeholder="جستجو در عنوان…" value="${q}" oninput="q=this.value;rows()"><select id="ff" style="width:auto" onchange="flt=this.value;rows()">${[['all','همه'],['w','در انتظار'],['o','معوق'],['p','پرداخت‌شده']].map(o=>`<option value="${o[0]}"${flt==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div><div class="cd" id="tbd">${rowsH()}</div>`}
function rowsH(){const L=all().filter(a=>(flt=='all'||stt(a.x)==flt)&&a.it.title.includes(q)).sort((a,b)=>a.x.due<b.x.due?-1:1);return L.map(a=>rowH(a)).join('')||'<small>موردی یافت نشد.</small>'}
const rowH=a=>`<div class="row"><div class="f"><b>${a.it.title}</b><br><small>${fd(a.x.due)} · ${money(a.x.amt)}</small></div>${bdg(a.x)}<button class="b" onclick="tog('${a.x.u}')">${a.x.paid?'لغو پرداخت':'پرداخت شد'}</button><button class="b" onclick="editI('${a.x.u}')">ویرایش</button></div>`;
const rows=()=>{$('#tbd').innerHTML=rowsH()};
function sett(){return notifCard()+arcCard()+`<div class="cd"><h3>داده‌ها (ذخیره محلی در مرورگر)</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b pri" onclick="exp()">دریافت نسخه پشتیبان</button><button class="b" onclick="$('#im').click()">بازیابی از فایل</button><input type="file" id="im" hidden accept=".json" onchange="imp(this.files[0])"><button class="b" onclick="sample()">افزودن داده نمونه</button><button class="b dng" onclick="if(confirm('همه داده‌ها پاک شود؟')){db={items:[]};save();render()}">پاک‌کردن همه</button></div></div>`}
function mod(h){const o=$('#mo');if(o){const sc=o.firstChild.scrollTop;o.firstChild.innerHTML=h;o.firstChild.scrollTop=/^<h3>(ویرایش|افزودن)/.test(h)?0:sc;return}const e=document.createElement('div');e.className='ov';e.id='mo';e.onclick=ev=>{if(ev.target==e)closeM()};e.innerHTML='<div class="md">'+h+'</div>';document.body.appendChild(e)}
function closeM(k){const e=$('#mo');if(e)e.remove();if(!k)cur=null}
document.onkeydown=e=>{if(e.key=='Escape')closeM()};
const rg=(a,b,s,f)=>{let h='';for(let i=a;i<=b;i++)h+=`<option value="${i}"${i==s?' selected':''}>${f(i)}</option>`;return h};

name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'AqsatApp/**'
      - 'AqsatApp.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p AqsatApp :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s AqsatApp/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aqsat-debug-apk
          path: AqsatApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

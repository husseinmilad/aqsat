name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'AqsatApp/**'
      - 'AqsatApp.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          test -s AqsatApp.zip
          unzip -q AqsatApp.zip -d .
          test -f AqsatApp/settings.gradle.kts
          test -f AqsatApp/app/build.gradle.kts


      - name: Install Aqsat launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("AqsatApp")
          manifests = list(root.glob("**/src/main/AndroidManifest.xml"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one AndroidManifest.xml, found {len(manifests)}")
          manifest = manifests[0]
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("Manifest has no application element")
          app.set(android + "icon", "@drawable/ic_launcher")
          app.set(android + "roundIcon", "@drawable/ic_launcher")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          res = manifest.parent / "res"
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "ic_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10243A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#173B52" android:pathData="M12,12h84v84h-84z"/>
              <path android:fillColor="#16B8A6" android:pathData="M54,18a27,27 0,1 0,0 54a27,27 0,1 0,0 -54"/>
              <path android:fillColor="#10243A" android:pathData="M54,24a21,21 0,1 0,0 42a21,21 0,1 0,0 -42"/>
              <path android:fillColor="#F4C66A" android:pathData="M44,46l7,7 15,-17 5,5 -20,23 -12,-12z"/>
              <path android:fillColor="#EAF4F6" android:pathData="M25,79h58v5h-58zM32,88h44v4h-44z"/>
              <path android:fillColor="#16B8A6" android:pathData="M20,78h7v7h-7zM20,87h7v5h-7z"/>
          </vector>
          """, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle -p AqsatApp :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="AqsatApp/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aqsat-debug-apk
          path: AqsatApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
